# The Mac artifact: a signed-when-possible .app in a .dmg, built from the
# offline web build plus the shell. No server, no network at runtime.
appId: app.pomodorus
productName: Pomodorus
directories:
  output: release
  buildResources: build
files:
  - dist/**/*
  - electron/*.cjs
  - package.json
# The tray widget reads its images at runtime, so they ship beside the app
# rather than inside the bundle.
extraResources:
  - from: build/
    to: assets/
    filter:
      - tray.png
      - tray@2x.png
mac:
  category: public.app-category.productivity
  icon: build/icon.icns
  target:
    - dmg
    - zip
  # Unsigned local build. Signing (CSC_LINK/CSC_KEY_PASSWORD) and notarizing
  # (APPLE_ID/APPLE_APP_SPECIFIC_PASSWORD/APPLE_TEAM_ID) attach at release
  # time, where hardenedRuntime goes back on with its entitlements.
dmg:
  window:
    width: 540
    height: 380
