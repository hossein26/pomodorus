<!doctype html>
<html lang="fa" dir="rtl" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Packaged, there is no server and no network: the page may only reach
         itself. `unsafe-inline` styles stay because the component library sets
         them; the localhost entry is the dev server and never resolves in the
         packaged app. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' http://localhost:5174 ws://localhost:5174;"
    />
    <meta name="theme-color" content="#000000" />
    <link rel="icon" href="./favicon.ico" sizes="48x48" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Pomodorus" />
    <title>Pomodorus</title>
    <meta name="description" content="یه اپ پومودوروی ساده" />
  </head>
  <!-- lg:bg-stone-950 is the surround the content frame's centred column sits
       on at desktop widths; on a phone the frame is flush and this never
       shows. -->
  <body class="flex min-h-screen flex-col lg:bg-stone-950">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
