# The production stack, for a single Linux box you own. Three containers:
# Postgres, the app, and Caddy terminating TLS in front of it.
#
# Run it from this directory:
#
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Secrets live in `deploy/.env`, which is gitignored. See docs/deploy-vps.md.
name: pomodorus

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: pomodorus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      POSTGRES_DB: pomodorus
      # The app stores every instant as UTC epoch millis and does its Tehran
      # day bucketing explicitly, so the database's own timezone must never be
      # allowed to matter.
      TZ: UTC
      PGTZ: UTC
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Capped so a flood cannot take the box down with it. The host has 4 GB
    # and 2 cores and is shared with other services, including sshd — an
    # unbounded container under load is how an incident becomes an incident you
    # cannot log in to fix.
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: "1.0"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pomodorus -d pomodorus"]
      interval: 5s
      timeout: 5s
      retries: 20
    # There is deliberately no `ports:` here. Docker publishes ports by
    # writing its own iptables rules, which are evaluated before ufw's — so a
    # published 5432 would be open to the whole internet no matter what ufw
    # says. The app reaches Postgres over the compose network instead, by the
    # service name, and nothing else can reach it at all.

  app:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      TZ: UTC
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      # Loopback only, and the bind address is the whole point: `8082:8081`
      # would publish the app to the internet regardless of ufw, because Docker
      # writes its own iptables rules. `127.0.0.1:8082` is reachable from the
      # host and from nothing else.
      #
      # This exists for the case where a reverse proxy already runs on the box
      # and owns 80/443 — then the `caddy` service below stays off and that
      # proxy points here. When the caddy service *is* used it ignores this and
      # reaches the app over the compose network instead.
      - "127.0.0.1:8082:8081"
    # A Go server under this app's load needs a few hundred goroutines, not a
    # few thousand OS threads. The pid cap turns a runaway into a failed
    # request instead of a wedged host. It lives under deploy.resources rather
    # than as the top-level `pids_limit`: setting both is rejected outright by
    # some Compose versions, and this is the spelling the compose spec defines.
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
          pids: 512
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://127.0.0.1:8081/api/health"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 10s
    # No `ports:` either, for the same reason. Caddy is the only way in.

  caddy:
    # Behind a profile, so `up -d` does not start it. A box that already runs a
    # reverse proxy gets a port conflict rather than a working deploy, and the
    # failure lands on whatever was already serving — so this one is opt-in:
    #
    #   docker compose -f deploy/docker-compose.prod.yml --profile edge up -d
    #
    # Use it when this machine has nothing else on 80/443. Otherwise leave it
    # off and point the existing proxy at 127.0.0.1:8082.
    profiles: ["edge"]
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates and account keys. Losing this volume means re-issuing
      # from Let's Encrypt, which is rate-limited — back it up, or at least
      # know that a `docker compose down -v` costs you an hour.
      - caddydata:/data
      - caddyconfig:/config
    depends_on:
      - app

volumes:
  pgdata:
  caddydata:
  caddyconfig:
