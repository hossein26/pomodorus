# Escalates application-level refusals into firewall drops.
#
# Two rules, and the split is the whole of it.
#
# A 429 counts only on /api/auth/*. There, a refusal means somebody is working
# through a login endpoint and the app already told them to stop; the limits
# behind it are tight — three codes per address, eight per IP per fifteen
# minutes — precisely because asking for a code is a rare event.
#
# Everywhere else a 429 is now an ordinary thing. The app rate limits writes
# per account and the whole of /api per address, and both refuse from memory
# without touching Postgres — so the "continuing to answer costs a database
# read" argument for banning does not apply to them. Counting them would also
# be actively harmful: past the per-address ceiling every further request is a
# 429, sixty of them arrive in seconds, and a ban here takes an entire Iranian
# carrier NAT offline for two hours. That is the outcome this jail's high
# threshold was chosen to avoid, and narrowing the URI is what keeps it avoided
# now that the app refuses far more often than it used to.
#
# A 403 still counts anywhere. The app never returns one, so a 403 is Caddy
# rejecting something malformed rather than a real user having a bad day.
#
# client_ip rather than remote_ip: Caddy resolves the former through
# trusted_proxies, so this keeps working if a CDN is ever put in front.
[Definition]
failregex = "client_ip":"<HOST>".*"uri":"/api/auth/[^"]*".*"status":429
            "client_ip":"<HOST>".*"status":403
ignoreregex =
journalmatch = _SYSTEMD_UNIT=caddy.service
